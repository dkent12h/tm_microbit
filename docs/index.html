<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teachable AI × micro:bit</title>
<style>
:root{--bg:#f4f3fb;--card:#fff;--text:#1d1b2e;--muted:#6b6880;--accent:#7c4dff;--ok:#12a150;--err:#d92d20;--track:#ebe8f5;--line:#e3e0ef}
@media (prefers-color-scheme:dark){:root{--bg:#121018;--card:#1c1926;--text:#ecebf3;--muted:#a19db5;--track:#2c2839;--line:#2f2a3d}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}
main{max-width:1000px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:30px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.step{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:6px}
h2{font-size:21px;margin:0 0 12px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 18px;background:var(--accent);color:#fff;cursor:pointer;font-size:17px}
button:disabled{opacity:.45;cursor:default}
button.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
input{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:15px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.status{margin-top:12px;font-size:16px;color:var(--muted)}
.status.ok{color:var(--ok)}.status.err{color:var(--err)}
#cam{display:flex;justify-content:center;align-items:center;min-height:280px;background:var(--track);border-radius:12px;overflow:hidden;color:var(--muted);text-align:center;padding:12px}
#cam canvas{width:100%;max-width:340px;height:auto;border-radius:12px}
#top{font-size:34px;font-weight:800;margin:0 0 6px;min-height:42px}
.bar{margin:12px 0}
.bar .name{display:flex;justify-content:space-between;font-weight:700;font-size:17px;margin-bottom:4px}
.bar .track{height:24px;background:var(--track);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;width:0;background:#b9a6ff;transition:width .15s}
.bar.top .fill{background:var(--accent)}
#sent{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--muted);margin-top:10px;word-break:break-all}
.tip{font-size:15px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<main>
  <h1>Teachable AI × micro:bit</h1>
  <p class="sub">컴퓨터 카메라로 분류한 결과를 마이크로비트로 보냅니다. 데스크톱 크롬이나 엣지에서 열어 주세요.</p>

  <div class="grid">
    <section class="card">
      <div class="step">1단계</div>
      <h2>micro:bit 연결</h2>
      <p class="tip">MakeCode 편집기와 마이크로비트가 연결되어 있다면 먼저 연결을 끊어 주세요.</p>
      <div class="row"><button id="connect">micro:bit 연결</button></div>
      <div id="serialStatus" class="status">연결 안 됨</div>
    </section>

    <section class="card">
      <div class="step">2단계</div>
      <h2>카메라 · AI 시작</h2>
      <input id="url" placeholder="마이크로비트에서 모델 주소를 자동으로 받아옵니다">
      <div class="row">
        <button id="startAI">카메라 · AI 시작</button>
        <button id="load" class="ghost">이 주소로 다시 불러오기</button>
      </div>
      <div id="modelStatus" class="status">모델 대기 중</div>
    </section>

    <section class="card">
      <div class="step">카메라</div>
      <div id="cam">카메라 · AI 시작을 누르면 화면이 나옵니다</div>
    </section>

    <section class="card">
      <div class="step">인식 결과</div>
      <div id="top"></div>
      <div id="bars"></div>
      <div id="sent"></div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const enc = new TextEncoder();
let port = null, writer = null, model = null, webcam = null;
let modelUrl = "", loading = false, busy = false;
let lastSentLabel = "", lastSentTime = 0, helloTimer = null, gotUrl = false;

function setStatus(id, text, cls) { const el = $(id); el.textContent = text; el.className = "status " + (cls || ""); }
function cleanUrl(u) { u = (u || "").trim(); if (u && !u.endsWith("/")) u += "/"; return u; }
function cleanLabel(s) { return String(s).replace(/[|\r\n]/g, " ").trim(); }

async function writeLine(text) {
  if (!writer) return;
  try { await writer.write(enc.encode(text + "\n")); } catch (e) {}
}

/* ---------- 모델 ---------- */
async function loadModel(url) {
  url = cleanUrl(url);
  if (!url || loading) return;
  if (!/^https:\/\/teachablemachine\.withgoogle\.com\/models\/[^/]+\/$/.test(url)) {
    setStatus("#modelStatus", "티처블머신 공유 주소가 아닙니다: " + url, "err");
    return;
  }
  loading = true; modelUrl = url; $("#url").value = url;
  setStatus("#modelStatus", "모델을 불러오는 중…");
  try {
    model = await tmImage.load(url + "model.json", url + "metadata.json");
    buildBars(model.getClassLabels());
    setStatus("#modelStatus", "모델 준비 완료 · 클래스 " + model.getTotalClasses() + "개", "ok");
  } catch (e) {
    model = null;
    setStatus("#modelStatus", "모델을 불러오지 못했습니다. 주소와 '모델 업로드' 여부를 확인하세요.", "err");
  }
  loading = false;
}

function buildBars(labels) {
  $("#bars").innerHTML = labels.map((l, i) =>
    `<div class="bar" id="b${i}"><div class="name"><span></span><span class="pct">0%</span></div><div class="track"><div class="fill"></div></div></div>`
  ).join("");
  labels.forEach((l, i) => { $("#b" + i + " .name span").textContent = l; });
}

/* ---------- 카메라 ---------- */
async function startCamera() {
  if (webcam) return;
  try {
    webcam = new tmImage.Webcam(340, 340, true);
    await webcam.setup();
    await webcam.play();
    $("#cam").innerHTML = "";
    $("#cam").appendChild(webcam.canvas);
    requestAnimationFrame(loop);
  } catch (e) {
    webcam = null;
    $("#cam").textContent = "카메라를 켤 수 없습니다. 주소창 왼쪽에서 카메라 권한을 허용해 주세요.";
  }
}

async function loop() {
  webcam.update();
  if (model && !busy) {
    busy = true;
    try {
      const preds = await model.predict(webcam.canvas);
      render(preds);
      send(preds);
    } catch (e) {}
    busy = false;
  }
  requestAnimationFrame(loop);
}

function render(preds) {
  let top = preds[0];
  preds.forEach(p => { if (p.probability > top.probability) top = p; });
  $("#top").textContent = top.className + " " + Math.round(top.probability * 100) + "%";
  preds.forEach((p, i) => {
    const el = $("#b" + i); if (!el) return;
    const pct = Math.round(p.probability * 100);
    el.querySelector(".fill").style.width = pct + "%";
    el.querySelector(".pct").textContent = pct + "%";
    el.classList.toggle("top", p === top);
  });
}

/* 결과가 바뀌면 바로, 같으면 0.3초마다 보냄 (마이크로비트 수신 버퍼 보호) */
function send(preds) {
  if (!writer) return;
  let top = preds[0];
  preds.forEach(p => { if (p.probability > top.probability) top = p; });
  const label = cleanLabel(top.className);
  const now = performance.now();
  if (now - lastSentTime < 120) return;
  if (label === lastSentLabel && now - lastSentTime < 300) return;
  lastSentLabel = label; lastSentTime = now;
  const msg = "TMPRED|" + label + "|" + top.probability.toFixed(4);
  writeLine(msg);
  $("#sent").textContent = "micro:bit로 보냄 → " + msg;
}

/* ---------- 시리얼 ---------- */
function handleLine(line) {
  line = line.trim();
  if (line.startsWith("TMURL|")) {
    gotUrl = true; clearInterval(helloTimer);
    const u = cleanUrl(line.slice(6));
    setStatus("#serialStatus", "연결됨 · 모델 주소 받음", "ok");
    if (u && u !== modelUrl) loadModel(u);
  }
}

async function readLoop() {
  const decoder = new TextDecoderStream();
  port.readable.pipeTo(decoder.writable).catch(() => {});
  const reader = decoder.readable.getReader();
  let buf = "";
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        handleLine(buf.slice(0, i));
        buf = buf.slice(i + 1);
      }
    }
  } catch (e) {}
}

async function connect() {
  if (!("serial" in navigator)) {
    setStatus("#serialStatus", "이 브라우저는 지원하지 않습니다. 데스크톱 크롬이나 엣지를 쓰세요.", "err");
    return;
  }
  try {
    port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x0d28 }] });
    await port.open({ baudRate: 115200 });
    writer = port.writable.getWriter();
    $("#connect").textContent = "연결됨"; $("#connect").disabled = true;
    setStatus("#serialStatus", "연결됨 · 모델 주소를 요청하는 중…", "ok");
    readLoop();
    let tries = 0; gotUrl = false;
    const hello = () => {
      if (gotUrl) return;
      if (tries++ >= 8) {
        clearInterval(helloTimer);
        setStatus("#serialStatus", "연결됨 · 모델 주소를 못 받았습니다. 블록에 주소를 넣었는지 확인하거나 아래에 직접 입력하세요.", "err");
        return;
      }
      writeLine("HELLO");
    };
    hello();
    helloTimer = setInterval(hello, 1000);
  } catch (e) {
    setStatus("#serialStatus", "연결 실패: MakeCode 쪽 연결을 끊고 다시 시도하세요.", "err");
  }
}

if ("serial" in navigator) {
  navigator.serial.addEventListener("disconnect", () => {
    writer = null; port = null; clearInterval(helloTimer);
    $("#connect").textContent = "micro:bit 연결"; $("#connect").disabled = false;
    setStatus("#serialStatus", "연결이 끊어졌습니다", "err");
  });
}

$("#connect").onclick = connect;
$("#startAI").onclick = async () => {
  await startCamera();
  const typed = $("#url").value;
  if (!model && typed) loadModel(typed);
  else if (!model && !modelUrl) setStatus("#modelStatus", "micro:bit를 연결하면 모델 주소를 받아옵니다. 직접 입력해도 됩니다.");
};
$("#load").onclick = () => { modelUrl = ""; loadModel($("#url").value); };
const q = new URLSearchParams(location.search).get("model");
if (q) { $("#url").value = q; }
</script>
</body>
</html>
